name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    name: Validate Scope Prompts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate Scope prompts
        run: ./scripts/validate-pr-checks.sh

  validate-windows-installer:
    name: Validate Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Scope runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Exercise project and user installs
        shell: pwsh
        run: |
          $projectTarget = Join-Path $env:RUNNER_TEMP "scope project target"
          New-Item -ItemType Directory -Force -Path $projectTarget | Out-Null

          $generatedPaths = @(
            ".claude/scripts/__pycache__/stale.pyc",
            ".claude/scripts/.pytest_cache/stale",
            ".claude/scripts/.DS_Store",
            "plugins/scope/scripts/__pycache__/stale.pyc",
            "plugins/scope/scripts/.pytest_cache/stale",
            "plugins/scope/scripts/.DS_Store"
          )
          foreach ($relativePath in $generatedPaths) {
            $path = Join-Path $projectTarget $relativePath
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $path) | Out-Null
            Set-Content -LiteralPath $path -Value "generated"
          }

          & .\install.bat $projectTarget
          if ($LASTEXITCODE -ne 0) { throw "Project install failed" }

          $requiredProjectPaths = @(
            ".claude/commands/wrap_epic.md",
            ".claude/commands/implement.md",
            ".claude/commands/epic_refine.md",
            ".claude/commands/audit_epic.md",
            ".claude/commands/epic_refine/reviewer-refinement.md",
            ".claude/commands/audit_epic/reviewer-audit.md",
            ".claude/agents/developer.md",
            ".claude/skills/project-documentation/SKILL.md",
            ".claude/skills/project-documentation/templates-technical-arc42-c4/epic/plan.md",
            ".claude/skills/project-documentation/templates-technical-arc42-c4/epic/review.md",
            ".claude/skills/project-documentation/templates-technical-arc42-c4/epic/approvals.yaml",
            ".claude/skills/project-documentation/templates-technical-arc42-c4/epic/verification.yaml",
            ".claude/governance/simplicity-and-size.md",
            ".claude/governance/developer-checklist.md",
            ".claude/config/scope-policy.yaml",
            ".claude/scripts/scope_common.py",
            ".claude/scripts/scope_providers.py",
            ".claude/scripts/scope_launch.py",
            ".claude/scripts/scope_review.py",
            ".claude/scripts/scope_verify.py",
            ".claude/scripts/scope_check.py",
            ".claude/workers/planner.md",
            ".claude/workers/implementer.md",
            ".claude/workers/reviewer.md",
            ".claude/requirements.txt",
            "plugins/scope/commands/wrap_epic.md",
            "plugins/scope/commands/implement.md",
            "plugins/scope/commands/epic_refine.md",
            "plugins/scope/commands/audit_epic.md",
            "plugins/scope/commands/epic_refine/reviewer-refinement.md",
            "plugins/scope/commands/audit_epic/reviewer-audit.md",
            "plugins/scope/agents/developer.md",
            "plugins/scope/skills/project-documentation/SKILL.md",
            "plugins/scope/skills/project-documentation/templates-technical-arc42-c4/epic/plan.md",
            "plugins/scope/skills/project-documentation/templates-technical-arc42-c4/epic/review.md",
            "plugins/scope/skills/project-documentation/templates-technical-arc42-c4/epic/approvals.yaml",
            "plugins/scope/skills/project-documentation/templates-technical-arc42-c4/epic/verification.yaml",
            "plugins/scope/governance/simplicity-and-size.md",
            "plugins/scope/governance/developer-checklist.md",
            "plugins/scope/config/scope-policy.yaml",
            "plugins/scope/scripts/scope_common.py",
            "plugins/scope/scripts/scope_providers.py",
            "plugins/scope/scripts/scope_launch.py",
            "plugins/scope/scripts/scope_review.py",
            "plugins/scope/scripts/scope_verify.py",
            "plugins/scope/scripts/scope_check.py",
            "plugins/scope/workers/planner.md",
            "plugins/scope/workers/implementer.md",
            "plugins/scope/workers/reviewer.md",
            "plugins/scope/requirements.txt",
            "plugins/scope/docs/reverse-engineering-guide.md",
            "plugins/scope/docs/SCOPE-README.md",
            "plugins/scope/scripts/scope-command",
            "plugins/scope/.codex-plugin/plugin.json",
            "plugins/scope/README.md",
            ".scope/config.yaml"
          )
          foreach ($relativePath in $requiredProjectPaths) {
            $path = Join-Path $projectTarget $relativePath
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing installed path: $relativePath" }
          }
          foreach ($relativePath in $generatedPaths) {
            $path = Join-Path $projectTarget $relativePath
            if (Test-Path -LiteralPath $path) { throw "Generated path was installed: $relativePath" }
          }

          $configPath = Join-Path $projectTarget ".scope/config.yaml"
          Set-Content -LiteralPath $configPath -Value "preserve: true"
          $stalePaths = @(
            ".claude/commands/scripts/scope-reviewer-tmux.sh",
            ".claude/commands/scripts/scope-reviewer-claude-pexpect.py",
            ".claude/scripts/scope-reviewer-claude-pexpect.py",
            ".claude/scripts/scope-proof-preflight.py",
            ".claude/config/worker-runtime-policy.yaml",
            ".claude/commands/implement_tdd.md",
            ".claude/governance/agent-lifecycle.md",
            ".claude/commands/scripts/validate-architecture-contracts.sh",
            ".claude/commands/scripts/validate-epic-docs.sh",
            ".claude/commands/audit_epic/reviewer-gemini.md",
            ".claude/commands/epic_refine/reviewer-architecture-gemini.md",
            ".claude/commands/audit_epic/reviewer-codex.md",
            ".claude/commands/audit_epic/reviewer-claude.md",
            ".claude/commands/audit_epic/reviewer-agy.md",
            ".claude/commands/audit_epic/reviewer-glm.md",
            ".claude/commands/epic_refine/reviewer-architecture-codex.md",
            ".claude/commands/epic_refine/reviewer-architecture-claude.md",
            ".claude/commands/epic_refine/reviewer-architecture-agy.md",
            ".claude/commands/epic_refine/reviewer-architecture-glm.md",
            "plugins/scope/scripts/scope-reviewer-tmux.sh",
            "plugins/scope/scripts/scope-reviewer-claude-pexpect.py",
            "plugins/scope/scripts/scope-proof-preflight.py",
            "plugins/scope/config/worker-runtime-policy.yaml",
            "plugins/scope/commands/implement_tdd.md",
            "plugins/scope/docs/epic-workflow.md",
            "plugins/scope/governance/agent-lifecycle.md",
            "plugins/scope/commands/audit_epic/reviewer-gemini.md",
            "plugins/scope/commands/epic_refine/reviewer-architecture-gemini.md",
            "plugins/scope/commands/audit_epic/reviewer-codex.md",
            "plugins/scope/commands/audit_epic/reviewer-claude.md",
            "plugins/scope/commands/audit_epic/reviewer-agy.md",
            "plugins/scope/commands/audit_epic/reviewer-glm.md",
            "plugins/scope/commands/epic_refine/reviewer-architecture-codex.md",
            "plugins/scope/commands/epic_refine/reviewer-architecture-claude.md",
            "plugins/scope/commands/epic_refine/reviewer-architecture-agy.md",
            "plugins/scope/commands/epic_refine/reviewer-architecture-glm.md",
            ".claude/skills/project-documentation/templates-technical-arc42-c4/epic/system-context.md",
            ".claude/skills/project-documentation/templates-technical-arc42-c4/epic/architecture.md",
            ".claude/skills/project-documentation/templates-technical-arc42-c4/epic/adr.md",
            ".claude/skills/project-documentation/templates-technical-arc42-c4/epic/pdr.md",
            ".claude/skills/project-documentation/templates-technical-arc42-c4/epic/test-strategy.md",
            ".claude/skills/project-documentation/templates-technical-arc42-c4/epic/acceptance-traceability.yaml",
            "plugins/scope/skills/project-documentation/templates-technical-arc42-c4/epic/system-context.md",
            "plugins/scope/skills/project-documentation/templates-technical-arc42-c4/epic/architecture.md",
            "plugins/scope/skills/project-documentation/templates-technical-arc42-c4/epic/adr.md",
            "plugins/scope/skills/project-documentation/templates-technical-arc42-c4/epic/pdr.md",
            "plugins/scope/skills/project-documentation/templates-technical-arc42-c4/epic/test-strategy.md",
            "plugins/scope/skills/project-documentation/templates-technical-arc42-c4/epic/acceptance-traceability.yaml",
            ".claude/scripts/validate-refinement.py",
            ".claude/scripts/audit-artifacts.py",
            ".claude/scripts/scope-wrap-finalize.py",
            ".claude/scripts/scope-dependency-merge.py",
            ".claude/scripts/scope_fingerprint.py",
            ".claude/scripts/scope_snapshot.py",
            ".claude/scripts/scope_proofs.py",
            ".claude/scripts/scope-worker.py",
            ".claude/scripts/scope-reviewer.py",
            ".claude/scripts/scope_codegraph.py",
            ".claude/scripts/scope_git.py",
            ".claude/config/audit-policy.yaml",
            ".claude/config/codegraph-policy.yaml",
            ".claude/config/execution-policy.yaml",
            ".claude/config/refinement-policy.yaml",
            ".claude/config/reviewer-policy.yaml",
            ".claude/config/worker-job.schema.json",
            ".claude/config/worker-result.schema.json",
            ".claude/config/wrap-policy.yaml",
            ".claude/config/worker-policy.yaml",
            ".claude/workers/refinement-worker.md",
            ".claude/workers/implementation-worker.md",
            ".claude/workers/diagnostic-worker.md",
            ".claude/commands/webepic_refine.md",
            ".claude/commands/webepic_implement.md",
            ".claude/commands/website_breakdown.md",
            ".claude/commands/content_refine.md",
            ".claude/governance/production-code-rules.md",
            ".claude/governance/test-strategy-guide.md",
            ".claude/skills/website-strategy/SKILL.md",
            ".claude/skills/project-documentation/templates-technical-arc42-c4/epic/design.md",
            ".claude/skills/project-documentation/templates-technical-arc42-c4/epic/delivery-manifest.yaml",
            ".claude/skills/project-documentation/templates-technical-arc42-c4/epic/implementation-evidence.yaml",
            "plugins/scope/scripts/validate-refinement.py",
            "plugins/scope/scripts/audit-artifacts.py",
            "plugins/scope/scripts/scope-wrap-finalize.py",
            "plugins/scope/scripts/scope-dependency-merge.py",
            "plugins/scope/scripts/scope_fingerprint.py",
            "plugins/scope/scripts/scope_snapshot.py",
            "plugins/scope/scripts/scope_proofs.py",
            "plugins/scope/scripts/scope-worker.py",
            "plugins/scope/scripts/scope-reviewer.py",
            "plugins/scope/scripts/scope_codegraph.py",
            "plugins/scope/scripts/scope_git.py",
            "plugins/scope/config/audit-policy.yaml",
            "plugins/scope/config/codegraph-policy.yaml",
            "plugins/scope/config/execution-policy.yaml",
            "plugins/scope/config/refinement-policy.yaml",
            "plugins/scope/config/reviewer-policy.yaml",
            "plugins/scope/config/worker-job.schema.json",
            "plugins/scope/config/worker-result.schema.json",
            "plugins/scope/config/wrap-policy.yaml",
            "plugins/scope/config/worker-policy.yaml",
            "plugins/scope/workers/refinement-worker.md",
            "plugins/scope/workers/implementation-worker.md",
            "plugins/scope/workers/diagnostic-worker.md",
            "plugins/scope/commands/webepic_refine.md",
            "plugins/scope/commands/webepic_implement.md",
            "plugins/scope/commands/website_breakdown.md",
            "plugins/scope/commands/content_refine.md",
            "plugins/scope/governance/production-code-rules.md",
            "plugins/scope/governance/test-strategy-guide.md",
            "plugins/scope/skills/website-strategy/SKILL.md",
            "plugins/scope/skills/project-documentation/templates-technical-arc42-c4/epic/design.md",
            "plugins/scope/skills/project-documentation/templates-technical-arc42-c4/epic/delivery-manifest.yaml",
            "plugins/scope/skills/project-documentation/templates-technical-arc42-c4/epic/implementation-evidence.yaml"
          )
          foreach ($relativePath in $stalePaths) {
            $path = Join-Path $projectTarget $relativePath
            New-Item -ItemType Directory -Force -Path (Split-Path $path) | Out-Null
            Set-Content -LiteralPath $path -Value "obsolete"
          }

          & .\install.bat $projectTarget
          if ($LASTEXITCODE -ne 0) { throw "Project reinstall failed" }
          if ((Get-Content -Raw -LiteralPath $configPath).Trim() -ne "preserve: true") {
            throw "Existing .scope/config.yaml was overwritten"
          }
          foreach ($relativePath in $stalePaths) {
            if (Test-Path -LiteralPath (Join-Path $projectTarget $relativePath)) {
              throw "Obsolete installed file was not removed: $relativePath"
            }
          }

          $userTarget = Join-Path $env:RUNNER_TEMP "scope user target"
          New-Item -ItemType Directory -Force -Path $userTarget | Out-Null
          $env:USERPROFILE = $userTarget
          & .\install.bat --user
          if ($LASTEXITCODE -ne 0) { throw "User install failed" }
          if (-not (Test-Path -LiteralPath (Join-Path $userTarget ".claude/commands/implement.md"))) {
            throw "User Claude install is missing"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $userTarget "plugins/scope/commands/implement.md"))) {
            throw "User Codex install is missing"
          }
          if (Test-Path -LiteralPath (Join-Path $userTarget ".scope/config.yaml")) {
            throw "User install must not create project config"
          }

          $currentTarget = Join-Path $env:RUNNER_TEMP "scope current target"
          New-Item -ItemType Directory -Force -Path $currentTarget | Out-Null
          Push-Location $currentTarget
          try {
            & (Join-Path $env:GITHUB_WORKSPACE "install.bat")
            if ($LASTEXITCODE -ne 0) { throw "Current-directory install failed" }
            if (-not (Test-Path -LiteralPath ".claude/commands/implement.md")) {
              throw "Current-directory Claude install is missing"
            }
            if (-not (Test-Path -LiteralPath "plugins/scope/commands/implement.md")) {
              throw "Current-directory Codex install is missing"
            }
            if (-not (Test-Path -LiteralPath ".scope/config.yaml")) {
              throw "Current-directory project config is missing"
            }
          } finally {
            Pop-Location
          }

      - name: Run platform-independent lifecycle unit tests
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/unit/test_review_state.py tests/unit/test_common.py
