# SCOPE Configuration Template
# Copy this file to .scope/config.yaml and customize for your project

# Project Information
project:
  name: "my-project"  # Project name (used in documentation)

# Scope is ready to use with local files. External tracking and documentation
# services are opt-in and are not required.

# Local tracking (active default)

tracking:
  method: arc42-c4                   # Infers: tracking-guide-arc42-c4.md
  skill: local-tracking-bash         # Local YAML files; no Jira connection
  project_key: PROJECT               # Local display prefix; safe to leave unchanged
  base_path: ./tracking              # Directory for tracking files

# Local documentation (active default)

documentation:
  technical-doc: arc42-c4            # Infers: technical-guide-arc42-c4.md + templates-technical-arc42-c4/
  product-doc: atlassian             # Template format only; does not enable Confluence
  skill: project-documentation-file  # Local Markdown files; no Confluence connection
  docs_path: ./docs                   # Directory for documentation files
