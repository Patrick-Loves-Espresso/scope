schema_version: 1
maximum_stories_per_group: 3
maximum_pre_audit_debugging_jobs: 2
proof_timeout_seconds: 3600
proof_poll_interval_seconds: 1
# Only these inherited variables plus the proof's approved environment names
# reach a command. Receipts contain their fingerprint, never their values.
environment:
  - PATH
  - HOME
  - USERPROFILE
  - SystemRoot
  - TEMP
  - TMP
  - TMPDIR
  - LANG
  - LC_ALL
parsers:
  - pytest
  - scope-json
  - exit-code
exit_code_levels:
  - static
  - runtime_command
  - operational
  - inspection
shell_executables:
  - sh
  - bash
  - zsh
  - fish
  - cmd
  - cmd.exe
  - powershell
  - powershell.exe
  - pwsh
