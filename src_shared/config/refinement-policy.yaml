schema_version: 3
delivery_manifest_version: 3
compatible_delivery_manifest_versions:
  - 1
  - 2
  - 3
refinement_state_version: 1
findings_version: 1
review_packet_version: 1
reviewer_receipt_version: 2

phases:
  product:
    required_artifacts:
      - details.md
      - acceptance-criteria.md
      - design.md
      - delivery-manifest.yaml
  review:
    required_artifacts:
      - details.md
      - acceptance-criteria.md
      - design.md
      - delivery-manifest.yaml
      - refinement-state.yaml
      - refinement-findings.yaml
  handoff:
    required_artifacts:
      - details.md
      - acceptance-criteria.md
      - design.md
      - delivery-manifest.yaml
      - refinement-state.yaml
      - refinement-findings.yaml
      - refinement-review.md

obsolete_artifacts:
  - refinement-profile.yaml
  - refinement-manifest.yaml
  - acceptance-traceability.yaml
  - refinement-handoff.yaml
  - refinement-approvals.yaml
  - refinement-correction-receipts.yaml
  - proof-preflight.yaml
  - refinement-metrics.yaml

risk_levels:
  - low
  - medium
  - high
  - critical

capabilities:
  - api_interface
  - persistence_migration
  - async_orchestration
  - external_integration
  - security_privacy
  - ui_accessibility
  - operations_deployment
  - llm_ml_evaluation
  - content_configuration

author_providers:
  - claude
  - codex

manifest:
  artifact_authorities:
    - canonical
    - evidence
  decision_statuses:
    - pending
    - decided
  proof_classifications:
    - existing_runnable
    - implementation_created
    - external_blocked
  proof_levels:
    - unit
    - integration
    - e2e
    - static
    - live_smoke
    - runtime_command
    - operational
    - inspection
  documentation_obligation_id_pattern: '^DOC-[0-9]{3}$'

state:
  statuses:
    - drafting
    - product_approved
    - in_review
    - ready_for_final_approval
    - approved
    - blocked
  authority_kinds:
    - product_contract
    - final_handoff
    - product_decision
    - accepted_risk
  authority_sources:
    - user
    - preapproval
  gate_decision: approved

gate_boundaries:
  product_contract:
    paths:
      - details.md
      - acceptance-criteria.md
  final_handoff:
    paths:
      - details.md
      - acceptance-criteria.md
      - design.md
      - delivery-manifest.yaml
      - refinement-findings.yaml
      - refinement-review.md
    include_story_plans: true
    include_completed_reviews: true
    include_owned_artifacts: true
  accepted_risk:
    paths:
      - details.md
      - acceptance-criteria.md
      - design.md
      - delivery-manifest.yaml

review:
  id_pattern: '^refine-[0-9]{3}$'
  kinds:
    - full
    - targeted
  profiles:
    - default
    - budget
  sets:
    standard:
      semantic_providers:
        - claude
        - codex
    expanded:
      semantic_providers:
        - claude
        - codex
        - agy
        - opencode
  allowed_providers:
    - claude
    - codex
    - agy
    - opencode
  missions:
    - semantic_core
    - capability_specialist
  specialist_risks:
    - high
    - critical
  maximum_full_reviews: 1
  maximum_targeted_reviews: 3
  minor_optional_from_review: 3

findings:
  id_pattern: '^RF-[0-9]{3}$'
  severities:
    - minor
    - major
    - blocking
  categories:
    - product_decision
    - architecture
    - contract
    - implementation_readiness
    - testability
    - mechanical
    - missing_evidence
    - specialist
  statuses:
    - open
    - corrected
    - verified
    - accepted_risk
    - deferred
  blocking_statuses:
    - open
    - corrected
  closure_statuses:
    - corrected
    - verified
  terminal_statuses:
    - verified
    - accepted_risk
    - deferred
