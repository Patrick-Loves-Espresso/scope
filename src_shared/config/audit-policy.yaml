schema_version: 3
attempt_version: 1
findings_version: 1
review_packet_version: 1
reviewer_receipt_version: 2
implementation_evidence_version: 2

modes:
  - full
  - targeted

attempt_limits:
  full: 1
  targeted: 1
  failed_review_recovery: 1

attempt_statuses:
  - pending
  - pass
  - fail
  - blocked

gate_statuses:
  - pending
  - pass
  - fail
  - blocked
  - not_applicable

review:
  profiles:
    - default
    - budget
  sets:
    standard:
      providers:
        - claude
        - codex
        - opencode
    expanded:
      providers:
        - claude
        - codex
        - agy
        - opencode
  allowed_providers:
    - claude
    - codex
    - agy
    - opencode
  mission: semantic_core

evidence:
  outcomes:
    - pass
    - fail
    - blocked

authority:
  kinds:
    - gate_not_applicable
    - accepted_risk
  sources:
    - user
    - preapproval
  decision: approved

findings:
  id_pattern: '^AF-[0-9]{3}$'
  severities:
    - minor
    - major
    - blocking
  categories:
    - implementation
    - architecture_contract
    - native_contract
    - testability
    - runtime_evidence
    - operations
    - security
    - data_integrity
    - documentation
    - mechanical
    - specialist
  dispositions:
    - remediation_required
    - user_decision
    - documentation_decision
    - accepted_risk
  statuses:
    - open
    - remediated_pending_verification
    - verified
    - accepted_risk
  status_by_disposition:
    remediation_required: open
    user_decision: open
    documentation_decision: open
    accepted_risk: accepted_risk
  terminal_statuses:
    - verified
    - accepted_risk

paths:
  delivery_manifest: delivery-manifest.yaml
  implementation_evidence: implementation-evidence.yaml
  findings: audit-findings.yaml
  report: epic_audit.md
  review_packet: review-packet.yaml
  reviewer_receipt: reviewer-receipt.yaml
