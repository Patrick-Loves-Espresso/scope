# Scope lifecycle policy. This is Scope's only policy file.

# Workers run on the provider that hosts the command (Claude Code or Codex). Claude models are
# Claude Code aliases that follow the latest model of the family; Codex has no such alias (U27).
workers:
  claude:
    planner: {model: opus, effort: xhigh}
    implementer: {model: opus, effort: xhigh}
  codex:
    planner: {model: gpt-6.1-sol, effort: xhigh}
    implementer: {model: gpt-6.1-sol, effort: xhigh}

# Reviewers used until the project chooses its own with /scope_reviewers (stored in
# .scope/reviewers.yaml, which a reinstall never touches). Refinement runs at high effort
# (plan §4.3). There is no default adjudicator: Scope cannot assume credits for any model (U25).
default_reviewers:
  refine:
    - {cli: claude, model: opus, effort: high}
    - {cli: codex, model: gpt-6.1-sol, effort: high}
  audit:
    - {cli: claude, model: opus, effort: xhigh}
    - {cli: codex, model: gpt-6.1-sol, effort: xhigh}
mandatory_retries: 1  # a failed mandatory reviewer or adjudicator in refinement or audit is retried once

# Preflight rejects an older CLI. Claude Code 2.1.278 could not run Opus 5.5 (dry run, 2026-09-23).
min_cli_versions:
  claude: "2.1.280"

timeouts_seconds:
  planner: 7200
  implementer: 14400
  reviewer: 3600
  preflight: 30
  validation_command: 3600

size:
  growth_threshold: 1.5        # D3: actual above 1.5x the planned cumulative estimate
  module_target_code_lines: 350
  module_limit_code_lines: 450
  story_complexity_max: 7

# Read-only shell commands Claude reviewers may run (prefix match).
reviewer_read_only_commands:
  - git diff
  - git log
  - git show
  - git status
  - codegraph explore
  - codegraph node
  - codegraph query
  - codegraph files
  - codegraph callers
  - codegraph callees
  - codegraph impact
  - codegraph affected
