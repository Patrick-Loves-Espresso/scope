schema_version: 2
allowed_models:
  codex: [gpt-6-astra]
  claude: [claude-fable-5-1]
  agy: [gemini-3.1-pro-high]
  opencode: [meta/muse-spark-1.3-contributor]
receipt_version: 2

identifier_pattern: '^[a-z][a-z0-9_]*$'
path_component_pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
minimum_output_bytes: 1
preflight_timeout_seconds: 15
termination_grace_seconds: 5

repairable_statuses:
  - preflight_failed
  - not_launched_preflight_barrier
  - launch_failed
  - infrastructure_failed_before_review
  - rate_quota_exhausted

paths:
  receipt: reviewer-receipt.yaml
  runtime_directory: tmp_debug/scope-reviewers/{epic_id}/{review_id}

workflows:
  refinement:
    workflow: refinement
    template: ../commands/epic_refine/reviewer-refinement.md
    review_id_keys:
      - review_id
    assignment_sources:
      - file: packet
        key: assignments
    allowed_providers:
      - claude
      - codex
      - agy
      - opencode
    allowed_missions:
      - semantic_core
      - capability_specialist
    paths:
      prompt: prompt-{provider}-{mission}.md
      output: review-{provider}-{mission}.md
      log: review-{provider}-{mission}.log
    placeholders:
      EPIC_ID: '{epic_id}'
      REVIEW_PROVIDER: '{provider}'
      REVIEW_MISSION: '{mission}'
      REPO_ROOT: '{repo_root}'
      REVIEW_PACKET_PATH: '{packet_path}'
      REVIEW_OUTPUT_PATH: '{output_path}'
    output_validation_patterns:
      - '(?m)^REVIEW_PROVIDER:\s*{provider}\s*$'
      - '(?m)^REVIEW_MISSION:\s*{mission}\s*$'
      - '(?m)^DECISION:\s*(approved|corrections_required|user_decision_required|unverified)\s*$'

  audit:
    workflow: audit
    template: ../commands/audit_epic/reviewer-audit.md
    review_id_keys:
      - attempt_id
    assignment_sources:
      - file: audit-attempt.yaml
        key: review.required_assignments
      - file: packet
        key: assignments
      - file: packet
        key: review.required_assignments
    allowed_providers:
      - claude
      - codex
      - agy
      - opencode
    allowed_missions:
      - semantic_core
    paths:
      prompt: prompt-{provider}-{mission_slug}.md
      output: review-{provider}-{mission_slug}.md
      log: review-{provider}-{mission_slug}.log
    placeholders:
      EPIC_ID: '{epic_id}'
      AUDIT_PROVIDER: '{provider}'
      AUDIT_MISSION: '{mission}'
      REVIEWER_IDENTITY: '{provider}/{mission}'
      REPO_ROOT: '{repo_root}'
      REVIEW_PACKET_PATH: '{packet_path}'
      OUTPUT_PATH: '{output_path}'
    output_validation_patterns:
      - '(?m)^AUDIT_PROVIDER:\s*{provider}\s*$'
      - '(?m)^AUDIT_MISSION:\s*{mission}\s*$'
      - '(?m)^DECISION:\s*(pass|findings|blocked|unverified)\s*$'

reviewer_sets:
  refinement:
    standard:
      - claude
      - codex
    expanded:
      - claude
      - codex
      - agy
      - opencode
  audit:
    standard:
      - claude
      - codex
      - agy
    expanded:
      - claude
      - codex
      - agy
      - opencode

reviewers:
  refinement:
    codex: {model: gpt-6-astra, reasoning_effort: max}
    claude: {model: claude-fable-5-1, reasoning_effort: max}
    agy: {model: gemini-3.1-pro-high, reasoning_effort: high}
    opencode: {model: meta/muse-spark-1.3-contributor, reasoning_effort: high}
  audit:
    codex: {model: gpt-6-astra, reasoning_effort: max}
    claude: {model: claude-fable-5-1, reasoning_effort: xhigh}
    agy: {model: gemini-3.1-pro-high, reasoning_effort: high}
    opencode: {model: meta/muse-spark-1.3-contributor, reasoning_effort: high}

reviewers_on_budget:
  refinement:
    codex: {model: gpt-6-astra, reasoning_effort: high}
    claude: {model: claude-fable-5-1, reasoning_effort: high}
    agy: {model: gemini-3.1-pro-high, reasoning_effort: high}
    opencode: {model: meta/muse-spark-1.3-contributor, reasoning_effort: high}
  audit:
    codex: {model: gpt-6-astra, reasoning_effort: high}
    claude: {model: claude-fable-5-1, reasoning_effort: high}
    agy: {model: gemini-3.1-pro-high, reasoning_effort: high}
    opencode: {model: meta/muse-spark-1.3-contributor, reasoning_effort: high}

providers:
  codex:
    backend: codex
    executable: codex
    executable_prefix_args: []
    version_args:
      - --version
    transport: codex-exec
    supervisor_timeout_seconds: 3600
    prompt_transport: stdin
    environment:
      NO_COLOR: '1'
    command_args:
      - exec
      - --ephemeral
      - --ignore-user-config
      - --cd
      - '{repo_root}'
      - --model
      - '{model}'
      - -c
      - 'model_reasoning_effort="{reasoning_effort}"'
      - --sandbox
      - read-only
      - --output-last-message
      - '{output_path}'
      - '-'
    infrastructure_error_patterns:
      - '(?i)failed to connect before (?:starting|sending) review'
      - '(?i)service unavailable before (?:starting|sending) review'

  claude:
    backend: claude
    executable: claude
    executable_prefix_args: []
    version_args:
      - --version
    help_args:
      - --help
    required_help_flags:
      - --print
      - --no-session-persistence
      - --permission-mode
    auth_args:
      - auth
      - status
      - --json
    transport: claude-print
    supervisor_timeout_seconds: 3600
    prompt_transport: stdin
    environment:
      NO_COLOR: '1'
    command_args:
      - --print
      - --safe-mode
      - --strict-mcp-config
      - --no-chrome
      - --no-session-persistence
      - --model
      - '{model}'
      - --effort
      - '{reasoning_effort}'
      - --permission-mode
      - dontAsk
      - --tools
      - Read,Glob,Grep,Bash
      - --allowedTools
      - Read,Glob,Grep
      - --disallowedTools
      - Write,Edit,NotebookEdit,Task,Agent
      - --output-format
      - text
    infrastructure_error_patterns:
      - '(?i)(authentication|connection|service unavailable).*(failed|error)'

  agy:
    backend: agy
    executable: agy
    executable_prefix_args: []
    version_args:
      - --version
    models_args:
      - models
    transport: agy-print
    fallback_model: gemini-3.5-flash-high
    fallback_workflows:
      - audit
    supervisor_timeout_seconds: 3660
    print_timeout: 60m
    prompt_transport: argument
    environment:
      NO_COLOR: '1'
    command_args:
      - --model
      - '{model}'
      - --sandbox
      - --print-timeout
      - '{print_timeout}'
      - --print
      - '{prompt_text}'
    rate_quota_error_patterns:
      - '(?i)\brate[ -]?limit(?:ed|ing)?\b'
      - '(?i)\bquota (?:exceeded|exhausted)\b'
      - '(?i)\bresource[_ -]?exhausted\b'
    infrastructure_error_patterns:
      - '(?i)authentication failed before review'
      - '(?i)failed to connect before review'

  opencode:
    backend: opencode
    executable: opencode
    executable_prefix_args: []
    version_args:
      - --version
    models_args:
      - models
    transport: opencode-run
    supervisor_timeout_seconds: 3660
    prompt_transport: argument
    environment:
      NO_COLOR: '1'
    command_args:
      - run
      - --pure
      - --agent
      - plan
      - --model
      - '{model}'
      - --variant
      - '{reasoning_effort}'
      - --dir
      - '{repo_root}'
      - '{prompt_text}'
    rate_quota_error_patterns:
      - '(?i)rate[ -]?limit'
      - '(?i)quota (?:exceeded|exhausted)'
    infrastructure_error_patterns:
      - '(?i)authentication.*(?:failed|required)'
      - '(?i)provider.*not found'
