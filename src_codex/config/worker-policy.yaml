schema_version: 2
provider: codex

workers:
  refinement:
    phases:
      product: {model: gpt-5.6-sol, reasoning_effort: high}
      design_handoff: {model: gpt-6-astra, reasoning_effort: max}
      correction: {model: gpt-6-astra, reasoning_effort: high}
  implementation:
    phases:
      story: {model: gpt-6-astra, reasoning_effort: max}
      audit_remediation: {model: gpt-6-astra, reasoning_effort: max}
      debugging: {model: gpt-6-astra, reasoning_effort: max}
  diagnostic:
    phases:
      investigate: {model: gpt-5.6-sol, reasoning_effort: high}

workers_on_budget:
  refinement:
    phases:
      product: {model: gpt-5.6-sol, reasoning_effort: high}
      design_handoff: {model: gpt-6-astra, reasoning_effort: high}
      correction: {model: gpt-6-astra, reasoning_effort: max}
  implementation:
    phases:
      story: {model: gpt-6-astra, reasoning_effort: max}
      audit_remediation: {model: gpt-6-astra, reasoning_effort: max}
      debugging: {model: gpt-6-astra, reasoning_effort: max}
  diagnostic:
    phases:
      investigate: {model: gpt-5.6-sol, reasoning_effort: high}

provider_settings:
  executable: codex

runtime:
  roles:
    refinement: {timeout_seconds: 7200}
    implementation: {timeout_seconds: 14400}
    diagnostic: {timeout_seconds: 3600}
  lifecycle:
    poll_interval_seconds: 1
    heartbeat_interval_seconds: 10
    normal_exit_grace_seconds: 0.5
    termination_grace_seconds: 3
    log_tail_lines: 40
    log_tail_characters: 8000
