schema_version: 2
provider: claude

workers:
  refinement:
    phases:
      product: {model: claude-opus-5, reasoning_effort: high}
      design_handoff: {model: claude-fable-5-1, reasoning_effort: max}
      correction: {model: claude-fable-5-1, reasoning_effort: high}
  implementation:
    phases:
      story: {model: claude-fable-5-1, reasoning_effort: max}
      audit_remediation: {model: claude-fable-5-1, reasoning_effort: max}
      debugging: {model: claude-fable-5-1, reasoning_effort: xhigh}
  diagnostic:
    phases:
      investigate: {model: claude-opus-5, reasoning_effort: high}

workers_on_budget:
  refinement:
    phases:
      product: {model: claude-opus-5, reasoning_effort: high}
      design_handoff: {model: claude-fable-5-1, reasoning_effort: high}
      correction: {model: claude-fable-5-1, reasoning_effort: high}
  implementation:
    phases:
      story: {model: claude-fable-5-1, reasoning_effort: high}
      audit_remediation: {model: claude-fable-5-1, reasoning_effort: high}
      debugging: {model: claude-fable-5-1, reasoning_effort: high}
  diagnostic:
    phases:
      investigate: {model: claude-opus-5, reasoning_effort: high}

provider_settings:
  executable: claude
  permission_mode: dontAsk

runtime:
  roles:
    refinement: {timeout_seconds: 7200}
    implementation: {timeout_seconds: 14400}
    diagnostic: {timeout_seconds: 3600}
  lifecycle:
    poll_interval_seconds: 1
    heartbeat_interval_seconds: 10
    normal_exit_grace_seconds: 0.5
    termination_grace_seconds: 3
    log_tail_lines: 40
    log_tail_characters: 8000
